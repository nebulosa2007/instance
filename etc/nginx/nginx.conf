include /etc/nginx/modules-enabled/*.conf;  #*/ Ubuntu
include modules.d/*.conf;                   #*/ Arch Linux
worker_processes auto;
worker_rlimit_nofile 20480;
error_log syslog:server=unix:/dev/log,facility=local7,tag=nginx_error,severity=error;
events {
    worker_connections 10240;
}
http {
    include mime.types; default_type application/octet-stream;
    types_hash_max_size 4096;
    map $status $loggable {
        444     1;
        default 0;
    }
    server_tokens off;
    access_log /var/log/nginx/fallback_access.log combined if=$loggable;
    keepalive_timeout 65; keepalive_requests 1000;
    client_body_timeout 10s; client_header_timeout 10s;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;
    reset_timedout_connection on;
    sendfile on; tcp_nopush on;
    limit_req_zone $binary_remote_addr zone=security:10m rate=10r/s;
    limit_req_status 444;
    map $http_user_agent $bad_user_agent {
        default 0;
        "~*pacman" 2; "~*curl" 2; "~*Happ" 2; "~*v2box" 2; "~*TelegramBot \(like TwitterBot" 2;
        "~*OAI-SearchBot" 3; "~*GPTBot" 3; "~*PerplexityBot" 3; "~*ClaudeBot" 3; "~*CCBot" 3;
        - 1; "" 1; "~*^[A-Za-z]+/[0-9\.]+\s*$" 1;
        "~*Screaming Frog SEO Spider" 1; "~*zgrab" 1; "~*CensysInspect" 1; "~*CyberOKInspect" 1;
        "~*NetcraftSurveyAgent" 1; "~*Netcraft Web Server Survey" 1; "~*Keydrop\.io" 1;
        "~*Hello from Palo Alto Networks" 1; "~*TelegramBot" 1; "~*CMS-Checker" 1;
        "~*Baiduspider" 1; "~*InternetMeasurement" 1; "~*l9scan" 1; "~*Assetnote" 1;
        "~*Fuzz Faster U Fool" 1; "~*cypex\.ai" 1; "~*LumeWebScan" 1;
        "~*okhttp" 1; "~*python-" 1; "~*Scrapy" 1; "~*Go-http-client" 1; "~*Python-urllib" 1;
        "~*Microsoft Power Automate" 1; "~*Let\'s Encrypt validation server" 1; "~*Randomized" 1;
        "~*Linux i686" 1; "~*Opera" 1; "~*CrOS" 1; "~*Minefield" 1; "~*Konqueror" 1;
        "~*MicroMessenger" 1; "~*MQQBrowser" 1;
        "~*Chrome/([0-9]|[1-9][0-9]|1[0-1][0-9]|12[0-4])\." 1;
        "~*Android\s+([1-9]|10)\." 1;
        "~*Firefox/([0-9]|[1-9][0-9]|1[0-1][0-9]|12[0-1])\." 1;
        "~*Version/([1-9]|1[0-2])\..*Safari" 1;
    }
    map $http_accept_encoding $is_no_encoding {
        default 0;
        "" 1;
    }
    map "$is_no_encoding|$bad_user_agent" $block_no_encoding {
        default 0;
        "1|0" 1;"1|1" 1;
    }
    map $server_protocol $is_not_http2 {
        default 1;
        "HTTP/2.0" 0;
    }
    map $uri $is_ws_path {
        default 0;
        "~*/ws/?$" 1;
    }
    map "$is_not_http2|$bad_user_agent|$is_ws_path" $block_http1 {
        default 0;
        "1|0|0" 1; "1|1|0" 1; "1|1|1" 1;
    }
    map $http_referer $is_bad_ref {
        default 0;
        "" 0;
        ~*^https?://([a-z0-9\-]+\.)?(sslip\.io|nip\.io|cdn-one\.org)(/|$) 0; ~*^https?://.* 1;
    }
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_protocols TLSv1.3;
    server {
        listen unix:/run/nginx.socket ssl http2 proxy_protocol backlog=4096 default_server;
        server_name _;
        error_log /dev/null crit;
        ssl_reject_handshake on;
        return 444;
    }
    server {
        listen unix:/run/nginx.socket;
        server_name mydomain.sslip.io mydomain.nip.io mydomain.cdn-one.org;
        root /var/www/html;
        index index.html;
        ssl_certificate /etc/letsencrypt/live/mydomain.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mydomain.sslip.io/privkey.pem;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        include    security.conf;
        location / {
            limit_req zone=security burst=20 nodelay;
            try_files $uri $uri/ =404;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
        include /etc/nginx/sites-enabled/x-ui.conf;
    }
}

stream {
    error_log syslog:server=unix:/dev/log,tag=nginx_stream crit;
    proxy_socket_keepalive on;
    proxy_connect_timeout 10s; proxy_timeout 1h; proxy_protocol_timeout 5s;
    map "$ssl_preread_server_name:$ssl_preread_alpn_protocols" $backend {
        ~^mydomain\.cdn-one\.org:.*my-secret-ssh unix:/run/sshd.socket;
        ~^mydomain\.sslip\.io(:|$)               unix:/run/xray_8443.socket;
        ~^mydomain\.nip\.io(:|$)                 unix:/run/xray_7443.socket;
        ~^mydomain\.cdn-one\.org(:|$)            unix:/run/xray_6443.socket;
        default                                  unix:/run/xray_8443.socket;
    }
    server {
        listen 443 reuseport so_keepalive=60s:10s:3 fastopen=256 backlog=4096;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $backend;
    }
    server {
        listen unix:/run/sshd.socket ssl proxy_protocol;
        ssl_session_cache shared:SSHSSL:1m;
        ssl_certificate /etc/letsencrypt/live/mydomain.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mydomain.sslip.io/privkey.pem;
        proxy_pass 127.0.0.1:22;
    }
}
